[tool.poetry]
name = "dg-bigquery-mcp-server"
version = "1.0.0"
description = "DG BigQuery MCP Server - BigQuery Data Governance"
authors = ["Sample Author <dev@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.104.0"
fastapi-mcp = ">=0.1.0"
httpx = ">=0.27.0"
uvicorn = ">=0.24.0"
pydantic = ">=2.5.0"
google-auth = ">=2.22.0"
google-auth-oauthlib = ">=1.0.0"
google-auth-httplib2 = ">=0.1.0"
google-cloud-bigquery = ">=3.11.0"
google-cloud-core = ">=2.3.0"
requests = ">=2.25.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-asyncio = "^0.21.0"
black = "^23.0.0"
isort = "^5.0.0"
mypy = "^1.0.0"
ruff = "^0.1.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 200
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 200

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 200
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "Q", "W291", "W292", "W293"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
