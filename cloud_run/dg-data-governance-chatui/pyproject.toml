[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "dg-data-governance-chatui"
version = "1.0.0"
description = "Data Governance Chainlit Chat UI - Dataplex Management Assistant"
authors = ["Sample Author <dev@example.com>"]

[tool.poetry.dependencies]
python = "^3.12"
chainlit = "^1.2.0"
requests = "^2.25.0"
google-auth = "^2.22.0"
google-auth-oauthlib = "^1.0.0"
google-auth-httplib2 = "^0.1.0"
aiohttp = "^3.8.0"
pydantic = "==2.8.2"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
mypy = "^1.8.0"

[tool.ruff]
target-version = "py312"
line-length = 200
include = ["*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "Q"]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"
indent-style = "space"

[tool.ruff.lint.isort]
force-single-line = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
