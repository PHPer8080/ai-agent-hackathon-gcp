[tool.poetry]
name = "dg_data_governance_agent"
version = "1.0.0"
description = "DG Data Governance Agent - A2Aマルチエージェント構成の親エージェント"
authors = ["Sample Author <dev@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.104.0"
uvicorn = ">=0.24.0"
pydantic = ">=2.5.0"
google-auth = ">=2.22.0"
google-adk = ">=1.8.0"
google-genai = ">=1.21.1"
requests = ">=2.25.0"
httpx = ">=0.28.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-asyncio = "^0.21.0"
ruff = "^0.1.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 200
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "Q", "W291", "W292", "W293"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
